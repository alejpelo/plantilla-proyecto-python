repos:
  - repo: local
    hooks:
      - id: pre-commit-checks
        name: pre-commit-checks => run all pre-commit checks
        stages: [pre-commit]
        language: system
        entry: just run-pre-commit-checks
        always_run: true
        pass_filenames: false
      - id: pre-push-checks
        name: pre-push-checks => run all pre-push checks
        stages: [pre-push]
        language: system
        entry: just run-pre-push-checks
        always_run: true
        pass_filenames: false
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.11.6
    hooks:
      - id: commitizen
        stages: [commit-msg]